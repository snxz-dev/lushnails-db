services:
  postgres:
    image: postgres:16-alpine
    container_name: lushnails-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lushnails_spa
      POSTGRES_USER: lushnails_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LushNails2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lushnails-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lushnails_admin -d lushnails_spa"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: lushnails-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lushnails_spa
      DB_USER: lushnails_admin
      DB_PASSWORD: ${DB_PASSWORD:-LushNails2024}
      SESSION_SECRET: ${SESSION_SECRET:-cambiar-esta-clave-en-produccion}
      ADMIN_PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lushnails-network

volumes:
  pgdata:
    driver: local

networks:
  lushnails-network:
    driver: bridge
